<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png" type="image/png">
    <title>New Tab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="build.css">
    
    <style id="theme-styles">
        /* Initial Default Theme Variables */
        :root {
            --bg-primary: #0a0b10;
            --bg-secondary: #242634;
            --glass-border: rgba(144, 202, 249, 0.2);
            --text-color: #e0e7ff;
            --accent-primary: #4f46e5;
            --chat-user-bg: rgba(79, 70, 229, 0.5);
            --chat-gemini-bg: rgba(36, 38, 52, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col overflow-hidden"> 
    
    <div class="max-w-7xl mx-auto w-full flex-grow flex items-center justify-center">
        <div class="grid grid-cols-4 gap-8 w-[85%] max-w-full h-[80vh]">

            <div id="quick-tiles-panel" class="col-span-1 glass-panel p-4 rounded-xl shadow-2xl relative group">
                <div id="shortcuts-list" class="flex flex-col gap-3 p-1 -m-1 content-start h-full max-h-[calc(100%-60px)]"></div>

                <div id="controls-footer" class="absolute bottom-0 left-0 right-0 p-3 pt-4 flex justify-between items-center opacity-0 transition-opacity duration-300">
                    <button type="button" id="edit-mode-toggle" class="px-3 py-1 text-sm translucent-button rounded-lg shadow-md">Edit</button>
                    <div class="flex space-x-2">
                        <button type="button" id="settings-button" class="p-2 translucent-button rounded-lg shadow-md hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-2.1a1.65 1.65 0 0 0-1-.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0-.33-1.82 1.65 1.65 0 0 0-1.51-1H2a2 2 0 0 1-2-2 2 2 0 0 1 2-2h2.1a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V2a2 2 0 0 1 2-2 2 2 0 0 1 2 2v2.1a1.65 1.65 0 0 0 1 .51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09l.3.3A1.65 1.65 0 0 0 19.4 15z"/></svg>
                        </button>
                        <button type="button" id="add-tile-button" class="p-2 translucent-button rounded-lg shadow-md hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-span-3 glass-panel p-6 rounded-xl shadow-2xl flex flex-col h-full overflow-hidden"> 
                <div id="chat-output" class="flex-grow space-y-4 p-3 bg-black/10 rounded-lg border border-gray-700 overflow-y-auto min-h-0">
                    <div class="flex justify-start">
                        <div class="max-w-xl p-3 rounded-xl backdrop-filter backdrop-blur-md border border-white/10 shadow-lg bg-gray-800/50 text-gray-100 chat-output">
                            <p class="font-semibold text-indigo-400">Gemini</p>
                            <p>Ask Away!</p>
                        </div>
                    </div>
                </div>

                <div class="flex space-x-3 mt-4"> 
                    <input type="text" id="prompt-input" class="flex-grow p-3 border border-gray-700 rounded-xl focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition duration-150 glass-input text-white placeholder-gray-500">
                    <button type="button" id="send-button" class="px-6 py-3 bg-indigo-700/50 text-white font-semibold rounded-xl hover:bg-indigo-600/60 focus:outline-none transition duration-150">Ask</button>
                </div>
                <p id="error-message" class="text-red-400 text-sm mt-2 hidden"></p>
                <p id="loading-message" class="text-indigo-400 text-sm mt-2 hidden">Searching...</p>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal fixed inset-0 hidden items-center justify-center modal-overlay">
        <div class="glass-panel p-6 rounded-xl shadow-2xl w-full max-w-md">
            <h3 class="text-xl font-bold mb-4 text-indigo-300 border-b pb-2 border-gray-700" id="modal-title">Edit Tile</h3>
            <form id="tile-form" class="space-y-4">
                <div><label class="block text-sm font-medium text-gray-300">Name</label><input type="text" id="tile-name" required class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-900 text-white"></div>
                <div><label class="block text-sm font-medium text-gray-300">URL</label><input type="url" id="tile-url" required class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-900 text-white"></div>
                <div><label class="block text-sm font-medium text-gray-300">Icon (1-2 chars)</label><input type="text" id="tile-icon" maxlength="2" required class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-900 text-white"></div>
                <div><label class="block text-sm font-medium text-gray-300">Color</label><input type="color" id="tile-color" required value="#8B5CF6" class="mt-1 block w-full h-10 border border-gray-600 rounded-md bg-gray-900 text-white cursor-pointer"></div>
                <input type="hidden" id="tile-id">
                <div class="flex justify-between items-center pt-4">
                    <button type="button" id="save-tile-btn" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-500">Save Changes</button>
                    <button type="button" id="delete-tile-button" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-500 hidden">Delete</button>
                    <button type="button" id="cancel-modal" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-500">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="settings-modal" class="modal fixed inset-0 hidden items-center justify-center modal-overlay">
        <div class="glass-panel p-6 rounded-xl shadow-2xl w-full max-w-lg">
            <div class="flex justify-between items-center border-b pb-2 border-gray-700 mb-4">
                <h3 class="text-xl font-bold text-indigo-300">Settings</h3>
                <button type="button" id="close-settings-modal-x" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="flex border-b border-gray-600 mb-4">
                <button type="button" class="tab-button px-4 py-2 text-sm font-medium border-b-2 transition duration-150" data-tab="general-tab" id="general-tab-button">General</button>
                <button type="button" class="tab-button px-4 py-2 text-sm font-medium border-b-2 transition duration-150" data-tab="memories-tab" id="memories-tab-button">Memories</button>
                <button type="button" class="tab-button px-4 py-2 text-sm font-medium border-b-2 transition duration-150" data-tab="visuals-tab" id="visuals-tab-button">Visuals</button>
            </div>

            <div id="general-tab" class="tab-content space-y-6">
                <form id="settings-form" class="space-y-4">
                    <div class="border border-indigo-700/50 p-4 rounded-lg bg-indigo-900/10">
                        <p class="font-semibold text-indigo-300 mb-2">Gemini API Configuration</p>
                        <div><label class="block text-xs font-medium text-gray-400">API URL</label><input type="text" id="api-url-input" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-900 text-white text-sm"></div>
                        <div><label class="block text-xs font-medium text-gray-400">API Key</label><input type="text" id="api-key-input" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-900 text-white text-sm"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-300">Max Saved Memories</label><input type="number" id="max-remembers" min="1" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-900 text-white"></div>
                    <div><label class="block text-sm font-medium text-gray-300">Chat Context Size</label><input type="number" id="context-size" min="0" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-900 text-white"></div>
                    <div class="flex justify-end pt-4 space-x-2">
                        <button type="button" id="save-settings-btn" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-500">Save Settings</button>
                        <button type="button" id="cancel-settings-modal" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-500">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="memories-tab" class="tab-content space-y-4 hidden">
                <div id="memories-list" class="space-y-3 max-h-64 overflow-y-auto p-2 bg-gray-900/50 border border-gray-700 rounded-md"></div>
                <div class="flex justify-end pt-4"><button type="button" id="clear-memories-button" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-500">Clear Memories</button></div>
            </div>

            <div id="visuals-tab" class="tab-content space-y-6 hidden">
                <div id="visuals-wrapper">
                    </div>
            </div>
        </div>
    </div>

    <script src="defaults.js"></script>
    <script src="script.js"></script>
</body>
</html>
